name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_laws:
        description: Run uncached proofs and six checker configurations
        type: boolean
        default: false
      run_mutants:
        description: Run the expensive isolated mutation examples
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ledger
      - name: Format, compile and ordinary tests
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --warnings-as-errors
      - name: Translation correspondence (bounded deterministic sample)
        run: uv run --locked python scripts/run_differential.py --samples 100 --timeout 300
      - name: Static analysis
        run: |
          mix credo --strict
          mix dialyzer
      - name: Proof tooling and law catalog
        run: |
          python3 scripts/review_policy.py --check
          uv run --locked python -m unittest discover -s tooling_tests -v
          uv run --locked python scripts/run_laws.py --supported-only --inspect-only
          uv run --locked python scripts/run_mutants.py
      - name: Demo, guides and package
        run: |
          mix run scripts/demo.exs
          mix docs --warnings-as-errors
          mix hex.build

  changes:
    runs-on: ubuntu-26.04
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FORMAL: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_laws }}
        run: python3 scripts/formal_gate.py detect

  formal:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ledger
      - run: uv run --locked python scripts/onboard.py --profile proofs
      - run: uv run --locked python scripts/run_laws.py --supported-only --stage full --report tmp/verification/checked.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: formal-evidence
          path: tmp/verification/

  formal-gate:
    if: ${{ always() }}
    needs: [changes, formal]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          DETECTION_RESULT: ${{ needs.changes.result }}
          FORMAL_REQUIRED: ${{ needs.changes.outputs.required }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: python3 scripts/formal_gate.py gate

  mutants:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mutants }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ledger
      - run: uv run --locked python scripts/onboard.py --profile proofs
      - run: uv run --locked python scripts/run_mutants.py --execute --report tmp/verification/mutants.json
