name: Review Workbench
on:
  push:
    paths:
      - 'apps/review_web/**'
      - 'lib/**'
      - 'test/**'
      - 'guides/**'
      - 'verification/**'
      - 'scripts/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'lean-toolchain'
      - '.tool-versions'
      - '.github/workflows/review-web.yml'
  pull_request:
    paths:
      - 'apps/review_web/**'
      - 'lib/**'
      - 'test/**'
      - 'guides/**'
      - 'verification/**'
      - 'scripts/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'lean-toolchain'
      - '.tool-versions'
      - '.github/workflows/review-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-web:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/review_web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.5'
          version-type: strict
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.12.6'
          python-version: '3.13.15'
      - name: Locked dependencies, compilation and tests
        run: |
          mix deps.get --check-locked
          git diff --exit-code -- mix.lock ../../mix.lock
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix credo --strict
          mix dialyzer
          mix docs --warnings-as-errors
          uv run --locked --directory ../.. python scripts/run_exunit.py --project apps/review_web
          mix assets.setup
          mix assets.build

      - name: Browser dependencies and isolated browser suites
        run: |
          npm ci --prefix test/browser
          cd test/browser
          npx --no-install playwright install --with-deps chromium
          uv run --locked --directory ../../../.. python scripts/run_browser.py all
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: review-browser-evidence
          path: |
            tmp/browser-runs/
            tmp/execution/
