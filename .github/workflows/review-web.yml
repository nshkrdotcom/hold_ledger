name: Review Workbench
on:
  push:
    paths:
      - 'apps/review_web/**'
      - 'lib/**'
      - 'test/**'
      - 'guides/**'
      - 'verification/**'
      - 'scripts/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'lean-toolchain'
      - '.tool-versions'
      - '.github/workflows/review-web.yml'
  pull_request:
    paths:
      - 'apps/review_web/**'
      - 'lib/**'
      - 'test/**'
      - 'guides/**'
      - 'verification/**'
      - 'scripts/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'lean-toolchain'
      - '.tool-versions'
      - '.github/workflows/review-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-web:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/review_web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
          version-type: strict
      - name: Locked dependencies, compilation and tests
        run: |
          mix deps.get --check-locked
          git diff --exit-code -- mix.lock ../../mix.lock
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix credo --strict
          mix dialyzer
          mix docs --warnings-as-errors
          mix test --warnings-as-errors
          mix assets.setup
          mix assets.build
